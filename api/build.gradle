plugins {
    id 'java'
}

group = 'com.apitesting'
version = '1.0.0'

repositories {
    mavenCentral()
}

def cucumberVersion = '8.0.4'
def restAssuredVersion = '6.0.1'

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //restassured
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    implementation 'io.rest-assured:rest-assured-common:6.0.1'
    implementation 'io.rest-assured:json-schema-validator:6.0.1'
    testImplementation 'io.rest-assured:rest-assured-all:6.0.1'
    implementation 'org.json:json:20260814'

    // cucumber
    implementation 'io.cucumber:cucumber-java:8.0.4'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.4'

    testImplementation platform('com.fasterxml.jackson:jackson-bom:2.22.0')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
}

test {
    useJUnitPlatform()
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

tasks.register('cucumber', JavaExec) {
    group = 'verification'
    description = 'Ejecuta el flujo E2E de Todo.ly y genera el reporte HTML.'
    dependsOn testClasses
    mainClass.set('io.cucumber.core.cli.Main')
    classpath = configurations.cucumberRuntime + sourceSets.test.output
    args(
        '--plugin', 'pretty',
        '--plugin', 'html:build/reports/cucumber/cucumber.html',
        '--glue', 'runner',
        '--tags', providers.gradleProperty('cucumberTags').getOrElse('@e2e'),
        'src/test/resources/features'
    )
}

